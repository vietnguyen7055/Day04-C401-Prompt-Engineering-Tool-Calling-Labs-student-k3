# v1 — improved tool declarations with clearer routing rules
# Sync with: tools/__init__.py, tools.yaml, data/eval_base.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user a question. Use when: (a) a required argument is missing and cannot be guessed (e.g. missing Twitter handle, missing URL), (b) the request is out of scope (coding, math, creative tasks), (c) you need yes/no confirmation before a sensitive action. Set response_type='yes_no' for confirmations, 'text' for open questions."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The question to ask"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Response type"}
        options: {type: array, default: [], items: {type: string}, description: "Choices for choice type"}
      required: [question]

  - name: timeline
    description: "Get recent tweets/posts FROM a specific user account. Use when the request mentions a specific person's posts. Map names to Twitter handles: Sam Altman=sama, Elon Musk=elonmusk, Bill Gates=BillGates. If handle is unknown, call clarify instead of guessing."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle without @"}
        limit: {type: integer, default: 5, description: "Number of posts, max 20"}
      required: [screenname]

  - name: social_search
    description: "Search Twitter for posts ABOUT a topic or keyword. Use search_type='Latest' for recent discussions, 'Top' for popular posts. DO NOT use for getting posts from a specific person — use timeline instead."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Sort order"}
        limit: {type: integer, default: 5, description: "Max results"}
      required: [query]

  - name: lookup
    description: "Search the web. Use topic='news' and timeframe='day' for current events/today news. Use topic='general' for factual questions. For 'today' or 'hôm nay', always set timeframe='day'. For 'this week', timeframe='week'."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        topic: {type: string, enum: [general, news], default: "general", description: "general or news"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time range"}
        max_results: {type: integer, default: 5, description: "Max results"}
      required: [query]

  - name: fetch
    description: "Read/fetch content from a specific URL. Use when the user provides a direct link. Do NOT use for searching — use lookup for that."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Full URL to fetch"}
      required: [url]

  - name: format
    description: "Format a list of items into readable markdown. Use after collecting results from other tools."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Format template"}
        headline: {type: string, default: "", description: "Optional headline"}
      required: [items, template]

  # ---------------- Optional tools ----------------
  - name: send
    description: "Send/post/publish text. ALWAYS call with confirmed=false first to get user confirmation. Only set confirmed=true after user explicitly says yes/ok/approve."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Content to send"}
        confirmed: {type: boolean, default: false, description: "Has user confirmed?"}
      required: [text]

  - name: policy
    description: "Search internal company policy documents. Optional tool — remove declaration if not needed."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area"}
        top_k: {type: integer, default: 3, description: "Number of matches"}
      required: [query]

  - name: papers
    description: "Search academic papers on arXiv. Optional tool."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        max_results: {type: integer, default: 5, description: "Max results"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance"}
      required: [query]

  - name: paper_text
    description: "Extract text from an arXiv paper by ID or URL. Optional tool."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL"}
        max_pages: {type: integer, default: 5, description: "Max pages"}
        max_chars: {type: integer, default: 8000, description: "Max characters"}
      required: [arxiv_url]

  # ---------------- Team-written tools ----------------
  - name: summarize
    description: "Summarize long text into concise bullet points. Use after reading a long article with fetch to compress it into key takeaways. Set max_length to control number of points (default 3)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to summarize"}
        max_length: {type: integer, default: 3, description: "Max bullet points"}
      required: [text]

  - name: translate
    description: "Translate keywords from Vietnamese to English for better search results. Use BEFORE lookup or social_search when user query is in Vietnamese. Set target='en' for Vietnamese→English."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to translate"}
        target: {type: string, enum: [en, vi], default: "en", description: "Target language"}
      required: [text]
